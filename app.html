<!DOCTYPE html>
<html lang="en">
  <!--
    Dashboard (app.html)
    Main application screen after login. pick a list, add tasks, edit or delete them.
    If someone opens this without logging in, ui.js setupAppPage() checks auth and sends
    them back to login.html.
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LifeBud | Dashboard</title>
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages.css" />
  </head>
  <body>
    <div class="app-shell">
      <!--
        Dashboard header. Log out returns to welcome screen.
        Profile circle shows first letter of their name from Supabase session.
      -->
      <header class="app-header">
        <p class="app-header__title">Welcome to LifeBud</p>
        <div class="app-header__actions">
          <div class="profile-icon" id="profile-icon" title="Profile">U</div>
          <button type="button" class="btn btn--dark" id="logout-btn">Log out</button>
        </div>
      </header>

      <div class="app-layout">
        <!--
          Left sidebar. Add list button and panel are wired in ui.js.
          The list buttons div below is still empty, sidebar buttons for switching between lists are not built yet.
        -->
        <aside class="app-sidebar panel-box">
          <h2 class="section-title">Your lists</h2>
          <button type="button" class="btn btn--primary" id="add-list-btn">Add list</button>

          <div id="add-list-panel" class="is-hidden">
            <!--
              We gave this box the same style as every other field on the page, since it was missing that style
              and looked like a plain white box before. We also gave it a label that screen readers can read out,
              since this field did not have a visible label the way the other fields do.
            -->
            <input class="input" type="text" id="new-list-name" placeholder="List name" aria-label="New list name" />
            <button type="button" class="btn btn--primary btn--small" id="confirm-add-list-btn">Add</button>
          </div>

          <div id="list-buttons" class="list-buttons"></div>
        </aside>

        <!--
          Middle column. Add form, edit panel, and task cards.
        -->
        <section class="app-main panel-box">
          <h2 class="app-main__heading" id="active-list-heading">Work</h2>

          <!--
            Add task form. Submit handled in ui.js setupAppPage().
            Input ids match what ui.js reads and maps to Task class fields.
          -->
          <form class="new-task-form" id="add-task-form">

            <!--
              List dropdown. ui.js fills this with the user's real list names from Supabase
              when the page loads so the person can choose which list the new task belongs to.
            -->
            <div class="field new-task-form__list-field">
              <label for="task-list">List</label>
              <select class="select" id="task-list" aria-label="List"></select>
            </div>

            <!--
              The three main task fields sit side by side in one row. The title is a free
              text input, priority is a dropdown defaulting to Medium, and the due date is
              an optional date picker. ui.js reads all three by id when the form is submitted.
            -->
            <div class="new-task-form__row">
              <input
                class="input"
                type="text"
                id="task-title"
                placeholder="What task needs doing?"
              />
              <select class="select" id="task-priority" aria-label="Priority">
                <option value="high">High</option>
                <option value="medium" selected>Medium</option>
                <option value="low">Low</option>
              </select>
              <input class="input" type="date" id="task-due-date" aria-label="Due date" />
            </div>

            <!--
              Optional notes field for any extra detail about the task.
            -->
            <label class="new-task-form__notes-label" for="task-notes">Notes</label>
            <textarea
              class="textarea"
              id="task-notes"
              placeholder="Extra information........"
            ></textarea>

            <!--
              Submit button. type="submit" means pressing Enter in any field in this form
              will also trigger a submit, not just clicking this button.
            -->
              
            <button type="submit" class="btn btn--primary">Add task</button>
          </form>

          <!--
            Edit task panel. Starts hidden. ui.js fills fields when they click Edit.
            cancel-edit-btn closes without saving.
          -->
          <section class="edit-task-form is-hidden" id="edit-task-panel" aria-hidden="true">
            <h3 class="edit-task-form__title">Edit task</h3>
            <form id="edit-task-form">
              <!--
                Hidden task id. Tells tasks.js update which task to change in Supabase.
              -->
              <input type="hidden" id="edit-task-id" />

              <!--
                List dropdown for the edit form. ui.js fills this with the same list names
                as the add form and pre-selects whichever list the task currently belongs to.
              -->
              <div class="field new-task-form__list-field">
                <label for="edit-task-list">List</label>
                <select class="select" id="edit-task-list" aria-label="List"></select>
              </div>

              <!--
                Same three field layout as the add form. ui.js pre fills the title, priority
                and due date with the task's existing values so the person can change just
                what they need without having to re enter everything.
              -->
              <div class="new-task-form__row">
                <input
                  class="input"
                  type="text"
                  id="edit-task-title"
                  placeholder="What task needs doing?"
                />
                <select class="select" id="edit-task-priority" aria-label="Priority">
                  <option value="high">High</option>
                  <option value="medium">Medium</option>
                  <option value="low">Low</option>
                </select>
                <input class="input" type="date" id="edit-task-due-date" aria-label="Due date" />
              </div>

              <!--
                Notes field for the edit form. Pre-filled by ui.js with the task's existing
                notes if it has any, or left blank if the task was saved without notes.
              -->
              <label class="new-task-form__notes-label" for="edit-task-notes">Notes</label>
              <textarea
                class="textarea"
                id="edit-task-notes"
                placeholder="Extra information........"
              ></textarea>

              <!--
                Save and Cancel sit side by side. Save submits the edit form which ui.js and
                intercepts to call Tasks.update. Cancel calls ui.js closeEditTask which hides
                the panel and resets the fields without saving anything to Supabase.
              -->
              <div class="edit-task-form__actions">
                <button type="submit" class="btn btn--primary">Save changes</button>
                <button type="button" class="btn btn--dark" id="cancel-edit-btn">Cancel</button>
              </div>
            </form>
          </section>

          <!--
            Where task cards appear. ui.js wipes this and draws cards when tasks exist.
          -->
          <div class="task-list-area" id="task-list-area">
            <div class="empty-state">No tasks yet. Add one above.</div>
          </div>
        </section>

        <!--
          Upcoming column. Not implemented this sprint.
          Kept in the layout but currently unused, nothing fills upcoming tasks area
        -->
        <aside class="app-upcoming panel-box">
          <div class="upcoming-header">
            <h2 class="upcoming-header__title">Upcoming Tasks</h2>
            <p class="upcoming-header__hint">Due in 1 to 3 days</p>
          </div>
          <div id="upcoming-tasks-area">
            <p>COMING SOON</p>
          </div>
        </aside>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/classes/Theme.js"></script>
    <script src="js/classes/Navigation.js"></script>
    <script src="js/classes/Task.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/tasks.js"></script>
    <script src="js/lists.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
